<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For You ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            overflow: hidden;
            text-align: center;
            padding: 20px;
        }

        .letter {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: fadeIn 2s ease;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        @keyframes floatHearts {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 1; }
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Heart_corazón.svg/1200px-Heart_corazón.svg.png') no-repeat center/contain;
            animation: floatHearts 8s infinite;
        }
    </style>
</head>
<body>
    <div class="letter">
        <h1>My Dearest ❤️</h1>
        <p>
            From the moment we met, my world has been brighter, my smile wider, and my heart fuller.
            You are my sunshine, my moonlight, and every beautiful thing in between.
            Thank you for being you—so wonderfully and perfectly you. 💕
        </p>
    </div>

    <!-- Floating hearts -->
    <script>
        const numberOfHearts = 20;
        for (let i = 0; i < numberOfHearts; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (5 + Math.random() * 5) + 's';
            document.body.appendChild(heart);
        }
    </script>

    <!-- Optional: Add background music -->
    <!--
    <audio autoplay loop>
        <source src="your-music-file.mp3" type="audio/mpeg">
    </audio>
    -->
</body>
</html>
